replicaCount: 1

image:
  repository: openvpn/openvpn-as
  tag: latest
  pullPolicy: IfNotPresent

# Deployment rollout strategy. Default is Recreate to preserve the chart's
# original behavior. Set RollingUpdate (with maxUnavailable: 0) for graceful,
# zero-all-down restarts when running multiple replicas (e.g. cluster mode).
updateStrategy:
  type: Recreate
  # rollingUpdate:
  #   maxUnavailable: 0
  #   maxSurge: 1

service:
  type: LoadBalancer
  annotations: {}
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  ports:
    admin: 943
    tcp: 443
    udp: 1194

persistence:
  enabled: true
  size: 5Gi
  storageClass:
  accessMode: ReadWriteOnce

  # Optional: use existing persistent volume claim
  pvcRefName:

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 1536Mi
  # requests:
  #   cpu: 100m
  #   memory: 1024Mi

securityContext:
  # privileged is required for access TUN devices starting from Kubernetes version 1.31.3
  # please check README for more options
  privileged: false
  capabilities:
    add:
      - NET_ADMIN
      - MKNOD

# Environment variables for the Access Server container. Handy for feeding the
# postStart script configuration/credentials without baking them into the script.
env: []
  # - name: CLUSTER_HOSTNAME
  #   value: vpn.example.com
envFrom: []
  # - secretRef:
  #     name: as-runtime-secrets

initContainers: []
  # - name: wait-for-ovpn
  #   image: busybox:1.36
  #   command: ["/bin/sh", "-c", "until grep -q '^ovpn ' /proc/modules; do sleep 3; done"]

podAnnotations: {}
podLabels: {}

serviceAccountName: ""
terminationGracePeriodSeconds:
nodeSelector: {}
tolerations: []
affinity: {}

lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 25"]

postStart:
  enabled: false

  # Optional: inline override
  customScript: ""

  # Optional: use existing secret
  secretRefName: ""
