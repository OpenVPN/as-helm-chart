apiVersion: v1
kind: Service
metadata:
  name: {{ include "openvpn-as.fullname" . }}
  labels:
    app: {{ include "openvpn-as.name" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    app: {{ include "openvpn-as.name" . }}
  ports:
    - port: {{ .Values.service.ports.admin }}
      targetPort: admin-gui
      protocol: TCP
      name: admin-gui
    - port: {{ .Values.service.ports.tcp }}
      targetPort: vpn-tcp
      protocol: TCP
      name: vpn-tcp
    - port: {{ .Values.service.ports.udp }}
      targetPort: vpn-udp
      protocol: UDP
      name: vpn-udp
