apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvpn-as.fullname" . }}
  labels:
    app: {{ include "openvpn-as.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ include "openvpn-as.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "openvpn-as.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        runAsUser: 0
      {{- if not (kindIs "invalid" .Values.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: admin-gui
              containerPort: {{ .Values.service.ports.admin }}
              protocol: TCP
            - name: vpn-tcp
              containerPort: {{ .Values.service.ports.tcp }}
              protocol: TCP
            - name: vpn-udp
              containerPort: {{ .Values.service.ports.udp }}
              protocol: UDP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: {{ .Values.securityContext.privileged }}
            capabilities:
              add: {{ toJson .Values.securityContext.capabilities.add }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.postStart.enabled .Values.lifecycle }}
          lifecycle:
            {{- if .Values.postStart.enabled }}
            postStart:
              exec:
                command: ["/bin/sh", "-c", "/scripts/configure.sh"]
            {{- end }}
            {{- with .Values.lifecycle }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            initialDelaySeconds: 100
            timeoutSeconds: 5
            exec:
              command: ["/usr/local/openvpn_as/scripts/sacli", "status"]
          readinessProbe:
            initialDelaySeconds: 100
            tcpSocket:
              port: {{ .Values.service.ports.admin }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: openvpn-data
              mountPath: /openvpn
            {{- end }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- if .Values.postStart.enabled }}
            - name: poststart-script
              mountPath: /scripts
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: openvpn-data
          persistentVolumeClaim:
            claimName: {{- if .Values.persistence.pvcRefName }}
                         {{ .Values.persistence.pvcRefName }}
                       {{- else }}
                         {{ include "openvpn-as.fullname" . }}-pvc
                       {{- end }}
        {{- end }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        {{- if .Values.postStart.enabled }}
        - name: poststart-script
          secret:
            secretName: {{- if .Values.postStart.secretRefName }}
                          {{ .Values.postStart.secretRefName }}
                        {{- else }}
                          {{ include "openvpn-as.fullname" . }}-poststart
                        {{- end }}
            defaultMode: 0700
        {{- end }}
